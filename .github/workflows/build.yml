name: build
on: [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 21 ]
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: upload release jar
        uses: actions/upload-artifact@v7.0.1
        with:
          path: |
            build/libs/Odin-*.jar
            !build/libs/Odin-*-sources.jar
          archive: false

      - name: Create Release
        if: github.ref == 'refs/heads/26.2' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/Odin-*.jar
          tag_name: build-${{ github.run_number }}-${{ github.run_id }}
          body: |
            Automated build from commit ${{ github.sha }}
            Branch: ${{ github.ref }}
            
            **Download the mod jar file below** - anyone can access this release!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}